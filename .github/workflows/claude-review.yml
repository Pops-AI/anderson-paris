name: Review Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Lis CLAUDE.md et AGENTS.md. Applique la section « Code Review Rules » au diff de cette PR.
            Lance `node scripts/verifier.mjs` et intègre ses erreurs.
            Poste chaque violation en commentaire inline avec la correction proposée,
            puis une synthèse en commentaire de PR. Réponds en français.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(node scripts/verifier.mjs)"
